<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Briefing de Identidade Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
/* Plano: papel frio, tinta quase preta, um único acento papoula.
   Layout: coluna de celular no centro, uma pergunta por tela, barra de protótipo acima. */
:root{
  --paper:#F2F3EF; --surface:#FFFFFF; --ink:#12181B; --muted:#5A6568; --line:#DADDD5;
  --accent:#3A4BD6; --accent-ink:#FFFFFF; --tint:#E4E8FC; --ok:#2E7D5B;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101416; --surface:#181E21; --ink:#EEF0EC; --muted:#9BA5A7; --line:#2A3236;
    --accent:#9AA6FF; --accent-ink:#0C1030; --tint:#1F2549; --ok:#5FC49A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101416; --surface:#181E21; --ink:#EEF0EC; --muted:#9BA5A7; --line:#2A3236;
  --accent:#9AA6FF; --accent-ink:#0C1030; --tint:#1F2549; --ok:#5FC49A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* barra de protótipo */
.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.demo b{font-family:var(--display);font-size:14px;margin-right:4px}
.demo label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.demo input,.demo select{font:inherit;font-size:13px;min-height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.demo input{width:140px}
.demo .mini{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px}

.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:16px 16px 24px}
.phone{position:relative;width:100%;max-width:420px;height:100%;max-height:900px;background:var(--paper);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08)}
@media (max-width:480px){
  .stage{padding:0}
  .phone{border:none;border-radius:0;max-height:none;box-shadow:none}
}

.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;min-height:56px}
.top .back{width:44px;height:44px;border-radius:50%;border:none;background:transparent;font-size:22px;display:grid;place-items:center;flex:none}
.top .back[hidden]{display:none}
.track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
.top .later{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;min-height:44px;padding:0 4px;flex:none}

.main{flex:1;min-height:0;overflow-y:auto;padding:12px 22px 20px}
.enter{animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.wave i{animation:none!important}}

.foot{padding:10px 22px 22px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.btn{min-height:52px;border-radius:14px;border:1.5px solid transparent;font-weight:700;font-size:16px;padding:0 20px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.88}
.btn:disabled{opacity:.4;pointer-events:none}
.primary{background:var(--accent);color:var(--accent-ink)}
.secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.ghost{background:none;border:none;color:var(--muted);min-height:44px;font-weight:500;font-size:14px;text-decoration:underline}

.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:8px 0 10px}
h1,h2{font-family:var(--display);line-height:1.12;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:700}
h2{font-size:26px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* intro */
.voice{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin:18px 0 8px}
.play{width:48px;height:48px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:16px;flex:none}
.voice .meta{flex:1;min-width:0}
.voice .who{font-weight:600;font-size:14px}
.bar{height:4px;background:var(--line);border-radius:9px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.voice .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.transcript{font-size:14px;color:var(--muted);margin:10px 2px 0}
.facts{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:12px}
.facts li{font-size:15px;padding-left:14px;border-left:3px solid var(--line)}
.facts b{font-weight:700}

/* história */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{flex:1;min-height:44px;border:none;background:none;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.recd{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.recd .t{font-weight:600}
.recd audio{width:100%}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:28px}
.mic.on{background:var(--ink);color:var(--paper)}
.wave{display:flex;gap:3px;align-items:center;height:34px}
.wave i{width:4px;height:6px;border-radius:3px;background:var(--accent);animation:w 0.9s ease-in-out infinite}
@keyframes w{0%,100%{height:6px}50%{height:30px}}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
textarea,.field{width:100%;font:inherit;font-size:16px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);resize:vertical}
textarea{min-height:150px}
.field{min-height:52px}
textarea:focus,.field:focus{border-color:var(--accent);outline:none}
details{margin-top:14px;font-size:14px}
summary{cursor:pointer;color:var(--muted);min-height:44px;display:flex;align-items:center}
details p{margin:0 0 6px;padding:12px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:0 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.static{pointer-events:none;min-height:36px;padding:0 14px;font-size:14px}
.count{font-size:13px;color:var(--muted);margin-top:14px;font-variant-numeric:tabular-nums}

/* espelho */
.mirror{background:var(--tint);border-radius:20px;padding:22px;margin:6px 0 18px}
.mirror p{font-family:var(--display);font-size:22px;line-height:1.25;margin:0;font-weight:500}
.mirror small{display:block;margin-top:12px;color:var(--muted);font-size:13px}

/* pares e quadros */
.pairs{display:flex;flex-direction:column;gap:14px}
.pair{padding:6px;background:var(--surface);border:2px solid var(--line);border-radius:24px;text-align:left;transition:border-color .15s,transform .08s}
.pair:active{transform:scale(.99)}
.pair[aria-pressed="true"]{border-color:var(--accent)}
.board{position:relative;height:158px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.board.lg{height:250px;padding:22px}
.b-top{display:flex;justify-content:space-between;align-items:center}
.b-mark{width:36px;height:36px;display:grid;place-items:center;font-weight:700;font-size:16px}
.lg .b-mark{width:48px;height:48px;font-size:22px}
.b-pill{font-size:11px;font-weight:700;padding:6px 12px;border:1.5px solid currentColor}
.b-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.b-name{font-size:22px;line-height:1.05}
.lg .b-name{font-size:34px}
.b-spec{font-family:var(--body);font-size:10.5px;letter-spacing:.14em;margin-top:6px;font-weight:600}
.lg .b-spec{font-size:12px}
.b-sw{display:flex;gap:5px;flex:none}
.b-sw i{display:block;width:14px;height:14px}
.lg .b-sw i{width:20px;height:20px}
.frame{position:absolute;inset:8px;border:1px solid;pointer-events:none}

/* nunca */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;height:120px;border-radius:16px;border:2px solid var(--line);overflow:hidden;padding:0;display:flex;align-items:flex-end;text-align:left}
.tile span.l{position:relative;z-index:2;font-size:12.5px;font-weight:600;padding:8px 10px;background:rgba(255,255,255,.88);color:#12181B;width:100%}
.tile .x{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(18,24,27,.62);color:#fff;font-size:34px}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile[aria-pressed="true"] .x{display:grid}
.tile .art{position:absolute;inset:0;display:grid;place-items:center}

/* devolutiva */
.sec{margin:22px 0 0}
.sec h3{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.sec p{margin:0}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-style:italic}
.warn{background:var(--tint);border-radius:14px;padding:14px;font-size:14.5px}
.warn button{margin-top:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:700}
.open{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.open button{min-height:44px;border:none;background:none;color:var(--accent);font-weight:700;text-decoration:underline;flex:none}
.sentence{font-family:var(--display);font-size:21px;line-height:1.28;font-weight:500}

.done{text-align:left;padding-top:36px}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:32px;margin-bottom:18px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:260px;overflow:auto}

/* sheet e toast */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.overlay.show{display:flex}
.sheet{width:100%;background:var(--paper);border-radius:24px 24px 0 0;padding:12px 22px 24px;max-height:85%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .pill{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 6px}
.sheet .opt{display:block;width:100%;text-align:left;min-height:50px;padding:0 16px;margin-top:8px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:500}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
.toast.show{opacity:1}

h2.long{font-size:22px;line-height:1.2}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cbtn{position:relative;display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:6px 6px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;min-height:84px}
.cbtn .cs{display:block;height:44px;border-radius:9px;border:1px solid rgba(0,0,0,.08)}
.cbtn .cl{font-size:12px;font-weight:600;padding:0 2px}
.cbtn .cm{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;display:none;place-items:center;font-size:14px;background:#fff;color:#12181B}
.cbtn[data-s="1"]{border-color:var(--ok)}
.cbtn[data-s="-1"]{border-color:var(--accent)}
.cbtn[data-s="1"] .cm,.cbtn[data-s="-1"] .cm{display:grid}
.cbtn[data-s="-1"] .cs{opacity:.45}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.addrow{display:flex;gap:8px;margin-top:16px}
.addrow .field{flex:1;min-width:0}
.addrow .btn{flex:none;min-height:52px}
.cbtn{touch-action:manipulation}
.cbtn[data-p="1"]{border-style:dashed;border-color:var(--accent)}

.thermo{margin:0 0 28px}
.th-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th-side{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);transition:opacity .2s,border-color .2s}
.th-side img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.th-side .pal{display:flex;aspect-ratio:1/1}
.th-side .pal i{flex:1;display:block}
.th-side .cap{font-size:13px;font-weight:700;padding:8px 10px;text-align:center}
.th-side.on{border-color:var(--accent)}
.th-side.off{opacity:.42}
.scale{position:relative;display:flex;justify-content:space-between;margin:10px 20px 0}
.scale:before{content:'';position:absolute;left:22px;right:22px;top:50%;height:4px;margin-top:-2px;background:var(--line);border-radius:4px}
.stop{position:relative;width:44px;height:44px;border:none;background:none;padding:0;display:grid;place-items:center}
.stop i{display:block;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--line);transition:transform .15s,background .15s}
.stop[aria-checked="true"] i{background:var(--accent);border-color:var(--accent);transform:scale(1.4)}
.th-read{text-align:center;font-size:14px;color:var(--muted);margin-top:2px;min-height:22px}
.mt{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;align-items:center;font-size:12.5px;margin:8px 0}
.mt span:last-child{text-align:right}
.mtr{position:relative;height:4px;background:var(--line);border-radius:4px;margin:0 8px}
.mtr i{position:absolute;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-left:-8px;display:block}
.board.ctr .b-top{justify-content:center}
.board.ctr .b-bottom{flex-direction:column;align-items:center;text-align:center}
</style>
</head>
<body>

<div class="demo">
  <b>Protótipo do briefing</b>
  <button class="mini" id="d-theme" type="button">Tema escuro</button>
  <button class="mini" id="d-restart" type="button">Reiniciar</button>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="top" id="top">
      <button class="back" id="back" type="button" aria-label="Voltar" data-a="back">←</button>
      <div class="track"><i id="prog"></i></div>
      <button class="later" type="button" data-a="later" id="later">Salvar e sair</button>
    </div>
    <div class="main" id="main"></div>
    <div class="foot" id="foot"></div>
    <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- dados ---------- */

    ex:'Quando a paciente chega perdida e sai entendendo o que está acontecendo com ela, eu volto para casa com vontade de abrir o consultório no dia seguinte.',
    sample:'O que mais me preenche é quando a paciente chega perdida e sai entendendo o que está acontecendo com ela. Isso me dá vontade de abrir o consultório no dia seguinte.',skip:'Pular esta pergunta'},

var WORDS_A=['acolhida','calma','proximidade','leveza','alegria'];

var AUD=['Pais e mães','Jovens adultos','Mulheres de 30 a 50','Pessoas acima de 60','Quem já está em tratamento','Quem nunca foi a um especialista','Outros médicos (encaminhamento)','Público amplo da cidade'];
var WHERE=['Instagram','Consultório (fachada e sala)','Receituário e papelaria','Site','Jaleco e uniforme','Material impresso'];
var COLORS=[
  {h:'#8FAE9B',n:'Verde-sálvia'},{h:'#1F5C66',n:'Azul-petróleo'},{h:'#A9CBE0',n:'Azul-claro'},{h:'#14213D',n:'Marinho'},
  {h:'#B9A7D6',n:'Lilás'},{h:'#D9A3A0',n:'Rosa-antigo'},{h:'#C0623A',n:'Terracota'},{h:'#D9A441',n:'Mostarda'},
  {h:'#E9DFCF',n:'Areia'},{h:'#6B1F34',n:'Vinho'},{h:'#1E4033',n:'Verde-floresta'},{h:'#3A3F45',n:'Grafite'}
];
var PAL={
  neutral:{bg:'#E8ECE7',ink:'#22302C',accent:'#6F8F82',sw:['#E8ECE7','#B9C7BF','#6F8F82','#22302C']},
  warm:{bg:'#F1E4D4',ink:'#3A2418',accent:'#C0623A',sw:['#F1E4D4','#E2B896','#C0623A','#3A2418']},
  cool:{bg:'#E0ECEC',ink:'#12303A',accent:'#2E7D86',sw:['#E0ECEC','#9CC5C8','#2E7D86','#12303A']}
};
var BASE={pal:'neutral',font:'sans',radius:14,mark:'square',rich:false,mode:'normal'};
var AX=[
  {id:'min',a:'Minimalista',b:'Maximalista',ia:'img/min.jpg',ib:'img/max.jpg'},
  {id:'cla',a:'Clássico',b:'Contemporâneo',ia:'img/cla.jpg',ib:'img/con.jpg'},

function sc(id){var v=state.th[id];return v==null?null:v-3}
function tone(){
  if(state.tone)return state.tone;
  var a=0,b=0;
  state.words.forEach(function(w){if(WORDS_A.indexOf(w)>-1)a++;if(WORDS_B.indexOf(w)>-1)b++});
  if(a===0&&b===0)return null;
  return a>b?'acolhimento':b>a?'autoridade':'equilíbrio';
}
function toneSentence(t){
  if(t==='acolhimento')return 'Sua marca precisa ser, antes de tudo, um lugar onde a pessoa se sente cuidada. A autoridade técnica vem junto, mas não vai na frente.';
  if(t==='autoridade')return 'Sua marca precisa transmitir domínio e segurança primeiro. O acolhimento entra depois, como tom, e não como cenário.';
  if(t==='equilíbrio')return 'Você quer as duas coisas ao mesmo tempo: cuidado e domínio técnico. O desafio do visual é não pender para um lado só.';
  return 'Você usou palavras só suas, e ainda não sei se o peso está no acolhimento ou na autoridade técnica.';
}
function liked(){return Object.keys(state.col).filter(function(h){return state.col[h]===1})}
function finalCfg(){
  var c=mix(BASE,{}),l=liked();
  var tem=sc('tem'),lum=sc('lum'),sat=sc('sat'),cla=sc('cla'),geo=sc('geo'),lud=sc('sob'),mm=sc('min'),dis=sc('dis'),sim=sc('sim');
  if(tem!==null&&tem<0)c.pal='warm';else if(tem!==null&&tem>0)c.pal='cool';
  if(cla!==null&&cla<0)c.font='serif';
  var curvy=(geo!==null&&geo>0)||(geo===null&&lud!==null&&lud>0);
  if(curvy){c.mark='circle';c.radius=30}else if(geo!==null&&geo<0){c.mark='square';c.radius=2}
  if(mm!==null&&mm>0)c.rich=true;
  if(lum!==null&&lum>0)c.mode='bold';else if(lum!==null&&lum<0)c.mode='soft';
  if(dis!==null&&dis>0)c.heavy=true;
  if(sim!==null&&sim<0)c.center=true;
  if(l[0])c.accent=l[0];else if(sat!==null&&sat>0)c.accent=(tem!==null&&tem>0)?'#2D5BFF':'#FF4B2B';
  if(l[1])c.acc2=l[1];
  return c;
}
function styleSentence(){
  var strong=[],mild=[],mid=[],open=0;
  ALLAX.forEach(function(x){
    var v=state.th[x.id];
    if(v==null){open++;return}
    var pre=x.pa?'cores ':'';
    if(v===3)mid.push(pre+x.a.toLowerCase()+' e '+x.b.toLowerCase());
    else{var w=pre+(v<3?x.a:x.b).toLowerCase();(Math.abs(v-3)===2?strong:mild).push(w)}
  });
  var out=[];
  if(strong.length)out.push('Você se coloca claramente do lado de '+joinPt(strong)+'.');
  if(mild.length)out.push('Com uma inclinação mais leve para '+joinPt(mild)+'.');
  if(mid.length)out.push('Ficou no meio em '+mid.join('; ')+'.');
  if(!out.length)return 'Você deixou todo o termômetro em aberto. Sem ele, qualquer direção que eu mostrar seria um chute.';
  if(open)out.push((open===1?'Um ponto ficou':open+' pontos ficaram')+' em aberto.');
  return out.join(' ');
}

function render(){

  var main=$('#main'),foot=$('#foot'),top=$('#top');
  main.innerHTML='<div class="enter">'+v.body+'</div>';
  main.scrollTop=0;

  top.style.display=v.noTop?'none':'flex';
  $('#back').hidden=!state.hist.length;
  $('#later').style.display=(id==='review')?'none':'';
  var total=STEPS.indexOf('extra')+1;
  var pct=id==='review'?100:Math.max(0,Math.min(100,Math.round(STEPS.indexOf(id)/total*100)));
  $('#prog').style.width=pct+'%';
  if(id==='done'){var j=$('#json');if(j)j.textContent=JSON.stringify(payload(),null,2)}
  schedSave();

/* ---------- ações ---------- */
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function toggleMax(arr,v,max){
  var i=arr.indexOf(v);
  if(i>-1){arr.splice(i,1);return true}
  if(arr.length>=max){toast('Até '+max+'. Desmarque uma para trocar.');return false}
  arr.push(v);return true;
}
var actions={
  next:function(){next()},
  back:function(){back()},
  later:function(){
    if(LIVE&&TOKEN){persist('em_andamento').catch(function(){});sheet('<h3>Pausar por aqui?</h3><p class="sub">Seu progresso já está salvo. Para continuar, abra de novo o mesmo link que você recebeu, no celular ou no computador.</p><button class="btn primary" style="width:100%" type="button" data-a="close">Entendi</button>')}
    else sheet('<h3>Pausar por aqui?</h3><p class="sub">Na versão real, seu progresso fica salvo e você volta pelo mesmo link.</p><button class="btn primary" style="width:100%" type="button" data-a="close">Entendi</button>');
  },
  close:function(){closeSheet()},
  play:function(){
    var a=$('#vaud');if(!a)return;
    if(a.paused){var pr=a.play();if(pr&&pr.catch)pr.catch(function(){toast('Não foi possível tocar o áudio.')})}
    else a.pause();
  },
  mode:function(el){state.omode=el.dataset.v;render()},
  rec:function(){
    var r=state.rec,k=cur();
    if(r.on){stopRecorder(false);return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Este navegador não grava áudio. Use o modo Escrever.');state.omode='txt';render();return}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recStream=stream;recChunks=[];recDiscard=false;
      var mt=pickMime();
      try{recorder=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('Não consegui iniciar a gravação. Use o modo Escrever.');state.omode='txt';render();return}
      recorder.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data)};
      recorder.onstop=function(){
        var sec=r.sec,type=recorder.mimeType||mt||'audio/webm';
        if(recStream){recStream.getTracks().forEach(function(t){t.stop()});recStream=null}
        clearInterval(timers.rec);r.on=false;
        if(recDiscard){recChunks=[];return}
        if(sec<2){toast('A gravação ficou muito curta. Tente de novo.');recChunks=[];render();return}
        var blob=new Blob(recChunks,{type:type});recChunks=[];
        if(blobUrls[k])URL.revokeObjectURL(blobUrls[k]);
        blobs[k]=blob;blobUrls[k]=URL.createObjectURL(blob);
        state.open[k].audio={path:null,sec:sec};
        render();uploadAudio(k);
      };
      r.on=true;r.sec=0;recorder.start();render();
      timers.rec=setInterval(function(){
        r.sec++;var t=$('#rtime');if(t)t.textContent=fmt(r.sec);
        if(r.sec>=600){stopRecorder(false);toast('Chegamos a 10 minutos. Salvei o que você gravou.')}
      },1000);
    }).catch(function(){toast('Não consegui acessar o microfone. Você pode escrever a resposta.');state.omode='txt';render()});
  },
  'rec-redo':function(){var k=cur();state.open[k].audio=null;if(blobUrls[k]){URL.revokeObjectURL(blobUrls[k]);delete blobUrls[k]}delete blobs[k];render()},
  'skip-open':function(){var k=cur();state.open[k].text='';state.open[k].rec=false;state.open[k].audio=null;next()},
  word:function(el){
    var v=el.dataset.v,i=state.words.indexOf(v);
    if(i>-1){
      state.words.splice(i,1);
      var c=state.customWords.indexOf(v);if(c>-1)state.customWords.splice(c,1);
    }else{
      if(state.words.length>=5){toast('Até 5. Desmarque uma para trocar.');return}

function syncAudio(e){
  var a=e.target;if(!a||a.id!=='vaud')return;
  var d=isFinite(a.duration)?a.duration:33,t=a.currentTime||0;
  var b=$('#vbar'),tm=$('#vtime'),pl=$('#play');
  if(b)b.style.width=Math.min(100,t/d*100)+'%';
  if(tm)tm.textContent=fmt(Math.floor(t))+' / '+fmt(Math.round(d));
  if(pl)pl.textContent=a.paused?'▶':'❚❚';
}
['timeupdate','play','pause','ended','loadedmetadata'].forEach(function(n){document.addEventListener(n,syncAudio,true)});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='cw'){e.preventDefault();actions['word-add']()}
});

/* barra de protótipo */
if($('#d-restart'))$('#d-restart').addEventListener('click',function(){stopTimers();closeSheet();state=fresh();render()});
if($('#d-theme'))$('#d-theme').addEventListener('click',function(){
  var root=document.documentElement;
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme',dark?'light':'dark');
  this.textContent=dark?'Tema escuro':'Tema claro';
});
if($('#d-theme')&&matchMedia('(prefers-color-scheme: dark)').matches)$('#d-theme').textContent='Tema claro';


function fatal(title,msg){
  $('#top').style.display='none';
  $('#main').innerHTML='<div class="enter"><div class="eyebrow">Briefing de identidade visual</div><h1>'+title+'</h1><p class="sub">'+msg+'</p></div>';
  $('#foot').innerHTML='';
}
function boot(){
  if(!LIVE){render();return}
  var d=document.querySelector('.demo');if(d)d.remove();
  if(!TOKEN){fatal('Este link está incompleto.','Peça o link de novo a quem enviou o briefing para você.');return}
  rpc('get_briefing',{p_token:TOKEN}).then(function(b){
    if(!b){fatal('Este link não está mais ativo.','Peça um novo link a quem enviou o briefing para você.');return}
    var e=b.estado||{};
    if(e&&e.step!=null){
      var f=fresh();
      for(var k in e){if(k!=='open')f[k]=e[k]}
      if(e.open){for(var q in e.open){f.open[q]=Object.assign({text:'',rec:false,audio:null},e.open[q])}}
      state=f;
    }
    if(b.status==='concluido'){concluded=true;state.step=STEPS.indexOf('done');render();return}
    if(state.step===STEPS.indexOf('done'))state.step=STEPS.indexOf('review');
    render();
    if(e&&e.step>0)toast('Retomei de onde você parou.');
  }).catch(function(){
    fatal('Não consegui abrir agora.','Verifique sua conexão e recarregue a página. Se continuar, avise quem enviou o briefing.');
  });
}
boot();
})();

</script>
